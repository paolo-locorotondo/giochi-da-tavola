<!doctype html>
<html lang="it" data-stile="tavolo" data-tema="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1a16" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Giochi da tavola</title>
    <!-- Applica stile e tema prima del primo disegno, per evitare il lampo del tema sbagliato. -->
    <script>
      (function () {
        var d = document.documentElement;
        var leggi = function (k) {
          try { return localStorage.getItem(k); } catch (e) { return null; }
        };
        var stile = leggi("gdt-stile");
        var scelta = leggi("gdt-tema");
        if (stile !== "tavolo") stile = "tavolo";
        if (scelta !== "light" && scelta !== "dark") {
          scelta = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        d.setAttribute("data-stile", stile);
        d.setAttribute("data-tema", scelta);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", scelta === "light" ? "#f3efe3" : "#0e1a16");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
